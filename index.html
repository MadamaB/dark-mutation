<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>DARK MUTATION — The Post-Human Garden</title>
<meta name="description" content="DARK MUTATION — Nature did not disappear. It became something else.">
<meta name="theme-color" content="#08090B">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#08090B;color:#C5CBD0;font:400 10px/1 'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;text-align:center;background:radial-gradient(60% 55% at 50% 55%,#15171a,#08090B 72%);transition:opacity 2.6s cubic-bezier(.16,1,.3,1),visibility 2.6s}
.gate.is-gone{opacity:0;visibility:hidden}
.gate__in{display:grid;gap:20px;justify-items:center}
.gate h1{font:300 clamp(30px,5.4vw,78px)/1 'Inter Tight',sans-serif;letter-spacing:.42em;text-indent:.42em;color:#dfe3e6}
.gate p{font:italic 300 clamp(17px,1.7vw,24px)/1.3 'Cormorant Garamond',Georgia,serif;color:#8d949a;letter-spacing:.04em}
.gate button{margin-top:26px;font:400 10px/1 'Inter Tight',sans-serif;letter-spacing:.52em;text-indent:.52em;text-transform:uppercase;color:#C5CBD0;background:none;border:1px solid rgba(197,203,208,.28);border-radius:999px;padding:18px 32px;cursor:pointer;transition:border-color .6s,background .6s,color .6s}
.gate button:hover,.gate button:focus-visible{border-color:#D9A5BE;color:#f0e6ea;background:rgba(217,165,190,.06);outline:none}
.gate small{font:400 9px/1.6 'Inter Tight',sans-serif;letter-spacing:.32em;text-transform:uppercase;color:rgba(197,203,208,.3)}
.snd{position:fixed;right:20px;bottom:18px;z-index:5;font:500 9px/1 'Inter Tight',sans-serif;letter-spacing:.38em;text-indent:.38em;text-transform:uppercase;color:#C5CBD0;background:rgba(8,9,11,.35);border:1px solid rgba(197,203,208,.2);border-radius:999px;padding:11px 15px;cursor:pointer;opacity:0;transition:opacity 1.5s,border-color .4s}
.snd.is-on{opacity:.6}.snd:hover,.snd:focus-visible{opacity:1;outline:none;border-color:#C5CBD0}
.hint{position:fixed;left:50%;bottom:26px;z-index:5;transform:translateX(-50%);font:400 9px/1 'Inter Tight',sans-serif;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;color:rgba(197,203,208,.4);opacity:0;transition:opacity 2s;pointer-events:none;white-space:nowrap}
.hint.is-on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<canvas id="c" aria-label="DARK MUTATION — scroll to drift through the living garden; move the cursor to look and to disturb it."></canvas>
<div class="gate" id="gate"><div class="gate__in">
  <h1>DARK MUTATION</h1>
  <p>The Post-Human Garden</p>
  <button id="enter">Enter the garden</button>
  <small>headphones recommended</small>
</div></div>
<button class="snd" id="snd" aria-pressed="false">Sound off</button>
<div class="hint" id="hint">scroll to drift</div>
<p class="sr" id="st" aria-live="polite"></p>

<script type="module">
import * as THREE from 'three';

/* DARK MUTATION — THE POST-HUMAN GARDEN
   One living organism, five spaces along one continuous drift (-z):
   01 THE ABANDONED GARDEN   z   9 → -104   mirror monoliths, black water, pale flowers, chrome roots from a sealed portal
   02 THE GLASS FOREST       z -106 → -192  liquid-chrome trunks, cable roots, hanging glass flowers, a translucent gate
   03 THE SPECIMEN CHAMBER   z -196 → -250  a suspended organism in a membrane is born; it releases a wave of light
   04 THE INFINITE BLOOM     z -252 → -346  a black-mirror corridor consumed by flowers growing on chrome vines
   05 THE NEW ORGANISM       z -348 → -440  a vast organism over a black pool; its roots are the garden's roots
   At the end a dark membrane closes and opens again on the first garden — altered. The journey is a loop.
   ROOTS → CHROME FOREST → MEMBRANE → BLOOM → NEW ORGANISM → ROOTS */

const $ = s => document.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LITE = location.search.includes('lite') || matchMedia('(pointer: coarse)').matches || (navigator.hardwareConcurrency || 8) <= 4;
const lerp = (a, b, k) => a + (b - a) * k, clamp01 = x => Math.max(0, Math.min(1, x));

/* ================================ RENDERER ================================ */
const canvas = $('#c');

{ const env = new THREE.Scene(); env.background = new THREE.Color(0x050607);

    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: softTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: c.clone().multiplyScalar(k), side: THREE.DoubleSide }));

const box = (grp, w, h, d, x, y, z, mat = archMat) => { const m = new THREE.Mesh(worldUV(new THREE.BoxGeometry(w, h, d), .08), mat); m.position.set(x, y, z); grp.add(m); return m; };

/* ================================ THE WATER — one black sheet under all five spaces ================================ */

else {
  const shader = { name: 'BlackWater', uniforms: { color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null }, uT: { value: 0 }, uRip: { value: ripples }, uFogC: { value: scene.fog.color.clone() }, uFogD: { value: scene.fog.density } },
    vertexShader: `uniform mat4 textureMatrix; varying vec4 vUvR; varying vec3 vW;

      void main(){ vUvR = textureMatrix * vec4(position, 1.); vW = (modelMatrix * vec4(position, 1.)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.);

    fragmentShader: `uniform vec3 color; uniform sampler2D tDiffuse; uniform float uT, uFogD; uniform vec3 uFogC; uniform vec4 uRip[${RIP}]; varying vec4 vUvR; varying vec3 vW;

      #include <logdepthbuf_pars_fragment>
      vec2 slope(vec2 p){
        vec2 g = (vec2(fbm(p * .35 + vec2(uT * .03, 0.)), fbm(p * .35 + vec2(5.2, uT * .025))) - .5) * .35;
        g += (vec2(vn(p * 3.1 + vec2(uT * .16, 0.)), vn(p * 2.9 + vec2(7.3, uT * .13))) - .5) * .05;
        for (int i = 0; i < ${RIP}; i++){ vec4 r = uRip[i]; float age = uT - r.z; if (age < 0. || age > 8.) continue;

                   + texture2DProj(tDiffuse, uv + vec4(0., br * 1.6, 0., 0.)).rgb + texture2DProj(tDiffuse, uv - vec4(0., br * 1.6, 0., 0.)).rgb) / 6.;

  water.rotation.x = -Math.PI / 2; water.position.set(0, 0, -415); scene.add(water); WU = water.material.uniforms;
  if (water.camera) water.camera.layers.enable(2);

/* ================================ SHARED: roots, flowers, nerves ================================ */
const rootU = { uT: { value: 0 }, uPulse: { value: 0 } };
const rootMat = new THREE.MeshPhysicalMaterial({ color: 0xaeb4ba, metalness: 1, roughness: .17, clearcoat: .4, clearcoatRoughness: .1, envMapIntensity: 1.1 });
rootMat.onBeforeCompile = sh => { Object.assign(sh.uniforms, rootU);
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nattribute float aSeed; attribute float aLen; varying vec2 vR;').replace('#include <begin_vertex>', '#include <begin_vertex>\n vR = vec2(uv.x * aLen, aSeed);');

    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      { float ph = fract(vR.x * .04 - uT * .07 + vR.y); float w = smoothstep(0., .02, ph) * smoothstep(.09, .02, ph);
        float ph2 = fract(vR.x * .11 - uT * .19 + vR.y * 3.); float w2 = smoothstep(0., .01, ph2) * smoothstep(.04, .01, ph2);

rootMat.customProgramCacheKey = () => 'roots';
function tube(pts, r0, r1, seg, rad = 6, sd = rnd(), wob = .18){

  for (let i = 0; i < p.count; i++){ const x = p.getX(i), v = p.getY(i) + .5, w = Math.pow(Math.sin(Math.PI * Math.min(1, v * 1.04)), .75) * (1 - .35 * v) * .36 + .02;

const PG = petalGeo();
const petalMat = new THREE.MeshPhysicalMaterial({ color: 0xeee2e8, roughness: .34, sheen: 1, sheenColor: new THREE.Color('#D9A5BE'), sheenRoughness: .35, iridescence: .35, iridescenceIOR: 1.3,
  emissive: new THREE.Color('#D9A5BE'), emissiveIntensity: .07, transparent: true, opacity: .9, side: THREE.DoubleSide, envMapIntensity: .8 });
const glassPetalMat = new THREE.MeshPhysicalMaterial({ color: 0xf4f1f7, roughness: .04, metalness: 0, iridescence: 1, iridescenceIOR: 1.5, specularIntensity: 1, envMapIntensity: 2.2,
  emissive: new THREE.Color('#D9A5BE'), emissiveIntensity: .08, transparent: true, opacity: .42, side: THREE.DoubleSide, depthWrite: false });
const stamenGeo = new THREE.CylinderGeometry(.0035, .005, .24, 4, 1).translate(0, .12, 0);
const stemMat = new THREE.MeshPhysicalMaterial({ color: 0x42474D, metalness: .9, roughness: .3, clearcoat: .5, envMapIntensity: .9 });
const UP = V(0, 1, 0);
// a set of flowers: stems (merged), petals and stamens (instanced). Each spot: base x,y,z, height h, head scale sc, growth normal n
function flowerSet(parent, spots, { petal = petalMat, stemR = .012, ghost = false } = {}){
  const list = [], sg = [];
  for (const s of spots){ const n = 5 + (rnd() * 3 | 0), base = V(s.x, s.y, s.z), q = new THREE.Quaternion().setFromUnitVectors(UP, (s.n || UP).clone().normalize()), lx = (rnd() - .5) * .4 * s.h, lz = (rnd() - .5) * .4 * s.h;

const M4 = new THREE.Matrix4(), RY = new THREE.Matrix4(), RX = new THREE.Matrix4(), SC = new THREE.Matrix4(), GS = new THREE.Matrix4(), tmpC = new THREE.Color(), V3 = V(0, 0, 0);
